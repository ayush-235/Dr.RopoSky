# Dr.RopoSky — Local Multi-Service Development Configuration
version: '3.8'

services:
  # Backend API Service (Phase 4)
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./backend:/app/backend:ro
      - ./analyzer:/app/analyzer:ro
    restart: unless-stopped

  # Frontend Web Service (Phase 5)
  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
